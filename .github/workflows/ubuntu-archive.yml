name: Signed Ubuntu package installation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'actions/ubuntu-archive/**'
      - '.github/workflows/ubuntu-archive.yml'
permissions:
  contents: read
jobs:
  archive:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: archive
        uses: ./actions/ubuntu-archive
      - name: Verify the archive signature and install the native prerequisites
        shell: bash
        env:
          ARCHIVE_CONFIG: ${{ steps.archive.outputs.config }}
        run: |
          sudo apt-get -c "$ARCHIVE_CONFIG" update
          if [[ $(. /etc/os-release && echo "$VERSION_CODENAME") == noble ]]; then
            packages=(protobuf-compiler=3.21.12-8.2ubuntu0.4 libprotoc32t64=3.21.12-8.2ubuntu0.4
              libprotobuf32t64=3.21.12-8.2ubuntu0.4 qemu-utils libfdt1 seabios)
          else
            packages=(protobuf-compiler bubblewrap libdbus-glib-1-2 xvfb)
          fi
          sudo apt-get -c "$ARCHIVE_CONFIG" install -y --no-install-recommends "${packages[@]}"
          if [[ ${packages[0]} == *=* ]]; then test "$(protoc --version)" = 'libprotoc 3.21.12'; fi
