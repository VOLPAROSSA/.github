name: Signed Ubuntu archive mirrors
description: Fetch verified Ubuntu package indices for the current job
outputs:
  config:
    description: Configuration for apt-get -c installs using the verified indices
    value: ${{ steps.prepare.outputs.config }}
runs:
  using: composite
  steps:
    - id: prepare
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/prepare.sh"
